name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: black
        run: black --check src tests examples docs

      - name: isort
        run: isort --check-only src tests examples docs

      - name: flake8
        run: flake8 src tests examples docs

      - name: mypy
        run: mypy src

  # Saving .gle must work, and the suite must stay green, on a machine with
  # no GLE binary. Nothing is built, so each leg runs in seconds; that makes
  # this the place for the Python-version and operating-system spread.
  test-without-gle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is pinned because ubuntu-latest (26.04) has no Python 3.9
        # build in actions/setup-python.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        # The supported floor and the newest release.
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm GLE is absent
        shell: bash
        run: |
          if command -v gle; then
            echo "gle found on the runner; this job no longer tests its absence"
            exit 1
          fi

      - name: Run tests
        run: pytest tests/ --tb=short

      # PYTHONUTF8: the examples print non-ASCII marks, which a Windows
      # console encoding cannot represent.
      - name: Run examples without compiling
        env:
          PYTHONUTF8: '1'
        run: python examples/run_and_compile.py --no-compile

  # What varies by operating system here is GLE itself, so one Python per
  # system is enough; test-without-gle covers the Python versions.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      # Pinned to a release tag: building an unpinned upstream master broke
      # CI when it grew a hard docbook-to-man requirement for man pages.
      GLE_VERSION: v4.3.9
      # gle-library commit whose include/ is installed as GLE's gleinc on
      # the source builds; the Windows zip ships its own gleinc.
      GLE_LIBRARY_COMMIT: 5b05bb7e70909eb2481cfe0f2709aae1371b602c
      # Windows Ghostscript: an ArtifexSoftware/ghostpdl-downloads release tag
      # and the SHA-256 of its gs*w64.exe asset.
      GS_WIN_RELEASE: gs10071
      GS_WIN_SHA256: 3A4C28D0AAC47AA7CCCD35A5932C55110376E9DBD966898DDE388B7FABA444A4
      # One flag for the pytest invocation, the file check, and the upload.
      COVERAGE: ${{ matrix.os == 'ubuntu-24.04' }}

    steps:
      - uses: actions/checkout@v4

      # These packages are needed on every run, cached GLE or not: the -dev
      # packages bring in the shared libraries the gle binary links against.
      # No TeX and no Qt: GLE builds its own TeX (inittex), the suite never
      # calls system latex, and Qt is only linked when BUILD_GUI is on.
      - name: Install GLE dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            make \
            libboost-dev \
            libcairo-dev \
            libdeflate-dev \
            libgs-dev \
            libjpeg-turbo8-dev \
            liblzma-dev \
            libpixman-1-dev \
            libpng-dev \
            libtiff-dev \
            libz-dev \
            libpoppler-dev \
            libpoppler-cpp-dev \
            libpoppler-glib-dev \
            libglib2.0-dev \
            extra-cmake-modules \
            ghostscript

      - name: Install GLE dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # GitHub's macOS runner images come with the aws/tap tap already
          # added (for the AWS CLI tooling bundled on the image). Homebrew's
          # tap-trust feature now requires third-party taps to be explicitly
          # trusted before their formulae/casks/commands are used, and warns
          # on every `brew install` while aws/tap is untrusted. We don't
          # install anything from aws/tap, so the warning is currently
          # harmless, but trust it explicitly (rather than the broader
          # HOMEBREW_NO_REQUIRE_TAP_TRUST=1 opt-out) to keep the log clean
          # and avoid a real failure if a future dependency ever resolves
          # through it. Guarded on the tap actually being present in case a
          # future runner image stops pre-tapping it.
          if brew tap | grep -qx aws/tap; then
            brew trust aws/tap
          fi
          # Boost stays: CMake's find_package is not REQUIRED, but
          # gle/drawit.cpp includes Boost.Math anyway.
          brew install --quiet \
            boost \
            cairo \
            ghostscript \
            jpeg-turbo \
            libdeflate \
            libpng \
            libtiff \
            pixman \
            zstd \
            poppler \
            glib \
            extra-cmake-modules

      # Ghostscript comes from Artifex's official Windows release, pinned by
      # tag and checksum, and is unpacked with 7-Zip rather than installed:
      # both the Chocolatey package and the silent installer hung until the
      # step timed out (#325). The unpacked tree is cached.
      - name: Restore cached Ghostscript (Windows)
        id: gs-cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/gs
          key: gs-${{ env.GS_WIN_RELEASE }}-${{ runner.arch }}-1

      - name: Install GLE dependencies (Windows)
        if: runner.os == 'Windows' && steps.gs-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $name = "$($env:GS_WIN_RELEASE)w64.exe"
          $exe = Join-Path $env:RUNNER_TEMP $name
          $url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/$($env:GS_WIN_RELEASE)/$name"
          Write-Host "Downloading $url"
          curl.exe --fail --location --silent --show-error --output $exe $url
          if ($LASTEXITCODE -ne 0) { throw "Download of $name failed" }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:GS_WIN_SHA256) {
            throw "$name does not match GS_WIN_SHA256"
          }
          Write-Host "Unpacking $name"
          7z x -y -bd "-o$(Join-Path $HOME 'gs')" $exe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not unpack $name" }

      # GLE runs gswin64c.exe by bare name.
      - name: Put Ghostscript on PATH (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $bin = Join-Path $HOME 'gs\bin'
          & (Join-Path $bin 'gswin64c.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "gswin64c.exe did not run" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      # GLE is cached, keyed on its version and the runner image. Bump the
      # trailing number to force a fresh install. A pull request can read the
      # cache written on main; an entry unused for a week is evicted, and the
      # next run builds (or, on Windows, downloads) GLE again.
      - name: Restore cached GLE
        id: gle-cache
        uses: actions/cache@v4
        with:
          path: ~/gle
          key: gle-${{ env.GLE_VERSION }}-lib-${{ env.GLE_LIBRARY_COMMIT }}-${{ matrix.os }}-${{ runner.arch }}-1

      # A restored binary can stop loading if the runner image moves the
      # libraries it was linked against. Install it again then instead of
      # failing.
      - name: Check restored GLE
        id: gle-check
        if: steps.gle-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          if "$HOME/gle/bin/gle" -info; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::cached GLE does not run on this image; installing it again"
            rm -rf "$HOME/gle"
          fi

      # Man pages and the QGLE GUI are disabled - the tests only need the
      # gle CLI. GLE installs gle-library's include/ as gleinc only when
      # GLE_EXAMPLES_LIBRARY_PATH points at a checkout; only include/ is
      # fetched.
      - name: Build GLE
        if: steps.gle-check.outputs.usable != 'true' && runner.os != 'Windows'
        run: |
          git clone --depth=1 --branch "$GLE_VERSION" https://github.com/vlabella/GLE.git "$RUNNER_TEMP/GLE"
          lib="$RUNNER_TEMP/gle-library"
          git init -q "$lib"
          git -C "$lib" remote add origin https://github.com/vlabella/gle-library.git
          git -C "$lib" sparse-checkout set include
          git -C "$lib" fetch -q --depth=1 --filter=blob:none origin "$GLE_LIBRARY_COMMIT"
          git -C "$lib" checkout -q FETCH_HEAD
          cmake -S "$RUNNER_TEMP/GLE/src" -B "$RUNNER_TEMP/GLE/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/gle" \
            -DGLE_EXAMPLES_LIBRARY_PATH="$lib" \
            -DBUILD_MANPAGES=OFF \
            -DBUILD_GUI=OFF
          # Bounded: a bare --parallel passes an unlimited -j to make, which
          # exhausts memory on the macOS runner and took the build from under
          # 3 minutes to 11.
          cmake --build "$RUNNER_TEMP/GLE/build" --config Release \
            --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install "$RUNNER_TEMP/GLE/build" --config Release

      # Building GLE on Windows needs its dependencies compiled through
      # vcpkg, so this leg uses upstream's prebuilt static build instead.
      - name: Download GLE (Windows)
        if: steps.gle-check.outputs.usable != 'true' && runner.os == 'Windows'
        shell: bash
        run: |
          archive="gle-graphics-${GLE_VERSION#v}-win64s.zip"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/vlabella/GLE/releases/download/$GLE_VERSION/$archive"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/${archive%.zip}" "$HOME/gle"

      - name: Put GLE on PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$HOME/gle/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/gle/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify GLE installation
        run: |
          gle -info

      # gleplot's scripts include these from GLE's include library.
      - name: Check GLE's include library
        shell: bash
        run: |
          top=$(gle -info | sed -n 's/^GLE_TOP: *//p' | tr -d '\r')
          if [ "$RUNNER_OS" = "Windows" ]; then top=$(cygpath -u "$top"); fi
          missing=0
          for f in palettes.gle brewer.gle color.gle contour.gle rugs.gle piesub.gle polarplot.gle graphutil.gle; do
            if [ ! -f "$top/gleinc/$f" ]; then
              echo "::error::$top/gleinc/$f is missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        shell: bash
        run: |
          if [ "$COVERAGE" = "true" ]; then
            pytest tests/ -v --tb=short --cov=gleplot --cov-report=xml
          else
            pytest tests/ -v --tb=short
          fi

      - name: Require coverage report
        if: env.COVERAGE == 'true'
        run: test -s coverage.xml

      # The docs workflow only runs on main, so without these steps a broken
      # example or Sphinx page is found after merge. They mirror what that
      # workflow does, on the leg that already has GLE: the gallery images
      # the strict build needs are compiled by the examples.
      - name: Run examples
        if: matrix.os == 'ubuntu-24.04'
        run: python examples/run_and_compile.py

      # Examples write only to the ignored examples/outputs/.
      - name: Check the examples left the tree clean
        if: matrix.os == 'ubuntu-24.04'
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Build documentation (warnings are errors)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          pip install -e ".[docs]"
          python docs/prepare_gallery.py --strict
          sphinx-build -W --keep-going -b html docs/source "$RUNNER_TEMP/docs-html"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: env.COVERAGE == 'true'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
