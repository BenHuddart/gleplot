[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gleplot"
version = "3.9.0"
description = "Matplotlib-like plotting library for GLE (Graphics Layout Engine)"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "GPL-2.0+"}
authors = [
    {name = "gleplot contributors"},
]
keywords = ["plotting", "graphics", "GLE", "scientific-visualization", "publication-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.900",
    "python-semantic-release>=10",
    # Raster ink measurement in integration and parser tests.
    "Pillow>=9.1",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "sphinx-autodoc-typehints>=1.10",
]
gle = [
    # GLE must be installed separately from system package manager
    # macOS: brew install gle
    # Linux: apt-get install gle (or yum/dnf)
]
[project.urls]
Homepage = "https://github.com/benhuddart/gleplot"
Documentation = "https://benhuddart.github.io/gleplot"
Repository = "https://github.com/benhuddart/gleplot"
"Bug Tracker" = "https://github.com/benhuddart/gleplot/issues"

[tool.setuptools]
package-dir = {"" = "src"}

# Discover every subpackage under src/gleplot automatically. The previous
# explicit list silently omitted gleplot.parser (imported by the core __init__,
# axes, figure, and writer modules), which broke non-editable installs.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561 marker: gleplot is fully typed and mypy-checked in CI.
"gleplot" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "gle: needs the external GLE binary; asserts on compiled output",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/gleplot/__init__.py:__version__"]
build_command = "pip install build && python -m build"
commit_message = "chore: release version {version}"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = []

[tool.semantic_release.changelog.default_templates]
changelog_file = "docs/CHANGELOG.md"

[tool.semantic_release.publish]
upload_to_vcs_release = false

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
