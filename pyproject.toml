[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gleplot"
version = "3.14.0"
description = "Matplotlib-like plotting library for GLE (Graphics Layout Engine)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-2.0+"}
authors = [
    {name = "gleplot contributors"},
]
keywords = ["plotting", "graphics", "GLE", "scientific-visualization", "publication-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    # Formatter output differs between black majors, so CI and local runs
    # must agree on one. Black 26 needs Python 3.10+; lint runs on 3.12.
    "black>=26,<27; python_version >= '3.10'",
    "isort>=5.12",
    "flake8>=6.0",
    # Like black, pinned to one major: a new mypy can report new errors, and
    # the lint job gates on a clean run. mypy 2 needs Python 3.10+.
    "mypy>=2.3,<3; python_version >= '3.10'",
    "python-semantic-release>=10",
    # Raster ink measurement in integration and parser tests.
    "Pillow>=9.1",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=0.18",
]
gle = [
    # GLE must be installed separately from system package manager
    # macOS: brew install gle
    # Linux: apt-get install gle (or yum/dnf)
]
[project.urls]
Homepage = "https://github.com/benhuddart/gleplot"
Documentation = "https://benhuddart.github.io/gleplot"
Repository = "https://github.com/benhuddart/gleplot"
"Bug Tracker" = "https://github.com/benhuddart/gleplot/issues"

[tool.setuptools]
package-dir = {"" = "src"}

# Discover every subpackage under src/gleplot automatically. The previous
# explicit list silently omitted gleplot.parser (imported by the core __init__,
# axes, figure, and writer modules), which broke non-editable installs.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561 marker; mypy runs in the CI lint job.
"gleplot" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
# No python_version pin: current numpy stubs use syntax mypy rejects when
# asked to check as 3.9. Runtime support for 3.9 is covered by the test matrix.
# Series and data sources are dict subclasses, so most accessors return Any
# by design; warning on that would mean a cast at every read.
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Optional at runtime (Figure.view in notebooks); not a dependency.
module = ["IPython.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "gle: needs the external GLE binary; asserts on compiled output",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/gleplot/__init__.py:__version__"]
build_command = "pip install build && python -m build"
commit_message = "chore: release version {version}"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = []

[tool.semantic_release.changelog.default_templates]
changelog_file = "docs/CHANGELOG.md"

[tool.semantic_release.publish]
upload_to_vcs_release = false

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
